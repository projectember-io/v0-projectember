<svg xmlns="http://www.w3.org/2000/svg" width="560" height="580" viewBox="0 0 560 580" role="img" aria-labelledby="title desc">
<title id="title">IT Operations responsibilities</title>
<desc id="desc">Integrity coordinates and reviews the work of Forge, Vault, and Conduit. This diagram describes responsibilities, not permission to make autonomous changes.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#e49a73" stroke-width="1.5"/></marker></defs>
<rect width="560" height="580" rx="18" fill="#141414"/>
<g font-family="Arial, sans-serif">
<text x="32" y="46" font-size="22" fill="#e49a73">IT OPERATIONS</text>
<rect x="32" y="72" width="496" height="104" rx="10" fill="#262626" stroke="#e49a73"/>
<text x="56" y="111" font-size="28" font-weight="700" fill="#f0f0f0">Integrity</text>
<text x="56" y="148" font-size="22" fill="#cccccc">Scope the work. Coordinate. Review.</text>
<path d="M64 176V488M64 256H108M64 372H108M64 488H108" fill="none" stroke="#e49a73" stroke-width="2"/>
<g fill="#202020" stroke="#555"><rect x="108" y="204" width="420" height="96" rx="10"/><rect x="108" y="320" width="420" height="96" rx="10"/><rect x="108" y="436" width="420" height="96" rx="10"/></g>
<g font-size="26" font-weight="700" fill="#f0f0f0"><text x="132" y="242">Forge</text><text x="132" y="358">Vault</text><text x="132" y="474">Conduit</text></g>
<g font-size="22" fill="#cccccc"><text x="132" y="277">Systems and services</text><text x="132" y="393">Storage and knowledge</text><text x="132" y="509">Networking and connectivity</text></g>
<text x="32" y="561" font-size="18" fill="#aaaaaa">Roles define ownership; changes still need authority.</text>
</g></svg>
